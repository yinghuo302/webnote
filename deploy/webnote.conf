# Install as /etc/nginx/conf.d/webnote.conf (included from nginx's http context).
# HTTPS-only: intentionally no port-80 listener or HTTP redirect.
limit_req_zone $binary_remote_addr zone=webnote_auth_10167:10m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name webnote.zanilia.eu.org;

    ssl_certificate /etc/letsencrypt/live/zanilia.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zanilia.eu.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:webnote_tls:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    root /opt/webnote/static;
    index index.html;
    autoindex off;
    client_max_body_size 6m;

    location ~ ^/api/public/(signin|signup|code)$ {
        limit_req zone=webnote_auth_10167 burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:10167;
        proxy_set_header Host webnote.zanilia.eu.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:10167;
        proxy_set_header Host webnote.zanilia.eu.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
